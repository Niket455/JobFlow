[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerpilot-backend"
version = "0.1.0"
description = "CareerPilot backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "openai>=1.40",
    "boto3>=1.34",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pdfplumber.*", "docx.*", "reportlab.*", "bs4.*", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
